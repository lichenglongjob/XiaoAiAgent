[project]
name = "myxiaoai"
version = "0.1.0"
description = "小爱音箱 Play 增强版 + LangGraph Agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.0",
    "uvicorn[standard]>=0.47.0",
    "langgraph>=1.2.0",
    "langchain-core>=1.4.0",
    "langchain-deepseek>=1.0.0",
    "langchain-mcp-adapters>=0.2.0",
    "pydantic>=2.13.0",
    "pydantic-settings>=2.14.0",
    "pyyaml>=6.0.3",
    "httpx>=0.28.0",
    "aiohttp>=3.11.0",
    "aiofiles>=24.1.0",
]

[project.scripts]
myxiaoai = "main:main"
